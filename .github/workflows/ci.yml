name: CI

on:
  push:
    branches: [master, foundation-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend · lint, migrations, tests (PostgreSQL + Neo4j)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrion
          POSTGRES_PASSWORD: astrion
          POSTGRES_DB: astrion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrion" --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      ASTRION_ENVIRONMENT: test
      ASTRION_DATABASE_URL: postgresql+psycopg://astrion:astrion@localhost:5432/astrion_test
      ASTRION_TEST_DATABASE_URL: postgresql+psycopg://astrion:astrion@localhost:5432/astrion_test
      ASTRION_TEST_NEO4J_URI: bolt://localhost:7687
      ASTRION_TEST_NEO4J_PASSWORD: ci-neo4j-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,s3]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Migrations round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests on SQLite
        env:
          ASTRION_TEST_DATABASE_URL: ""
          ASTRION_TEST_NEO4J_URI: ""
        run: pytest -o addopts="" -q
      - name: Tests on PostgreSQL + Neo4j (no skips allowed)
        run: pytest -o addopts="" -q -rs | tee pytest.log && ! grep -q "SKIPPED" pytest.log

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrion
          POSTGRES_PASSWORD: astrion
          POSTGRES_DB: astrion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrion" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTRION_ENVIRONMENT: test
      ASTRION_DATABASE_URL: postgresql+psycopg://astrion:astrion@localhost:5432/astrion
      ASTRION_STORAGE_LOCAL_ROOT: ${{ runner.temp }}/astrion-storage
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend setup
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
      - name: Frontend setup
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
