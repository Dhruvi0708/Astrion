# Local infrastructure for ASTRION development.
# NOTE: not exercised locally (Docker was unavailable). CI uses the same images as service containers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: astrion
      POSTGRES_PASSWORD: astrion
      POSTGRES_DB: astrion
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrion"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/change-me-please
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]

volumes:
  pgdata:
  neo4jdata:
